name: Daily Chess Game Sync

on:
  schedule:
    # Runs every day at 01:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows you to manually click a button to test/run it anytime

jobs:
  sync-games:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run synchronization script
      env:
        CHESS_COM_USER: ${{ secrets.CHESS_COM_USER }}
        LICHESS_USER: ${{ secrets.LICHESS_USER }}
        CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
      run: python chess_harvest.py
